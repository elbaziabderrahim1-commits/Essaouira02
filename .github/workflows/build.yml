name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3
        with:
          path: 'user_files'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create fresh Flutter project
        run: |
          flutter create staff_app
          cp user_files/lib/main.dart staff_app/lib/main.dart
          cp user_files/pubspec.yaml staff_app/pubspec.yaml

      - name: Install dependencies & build
        run: |
          cd staff_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: staff_manager_app
          path: staff_app/build/app/outputs/flutter-apk/app-release.apk
